[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotlift"
version = "0.3.1"
description = "High-frequency causal Linear TV attribution engine — measure TV ad lift on GA4 and Amazon AMC"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "flovv", email = "flovv@users.noreply.github.com" }
]
maintainers = [
    { name = "flovv", email = "flovv@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = [
    "tv-attribution",
    "linear-tv",
    "ga4",
    "amazon-marketing-cloud",
    "amc",
    "econometrics",
    "post-buy-analysis",
    "shifted-gamma",
    "media-mix-modeling",
    "causal-inference",
    "broadcast",
    "ad-attribution",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pydantic",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.scripts]
spotlift = "spotlift.cli:app"

[project.urls]
Homepage = "https://github.com/flovv/spotlift"
Documentation = "https://flovv.github.io/spotlift/"
Repository = "https://github.com/flovv/spotlift"
Changelog = "https://github.com/flovv/spotlift/releases"
"Bug Tracker" = "https://github.com/flovv/spotlift/issues"
"Pro License" = "https://buy.polar.sh/polar_cl_eHd0shvN1nvDYVV59IkhvvPDNw4Rxmu77INZ023fbF4"

[tool.hatch.build.targets.wheel]
packages = ["spotlift"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "S110", "BLE001"]


[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "scipy.*",
    "spotlift_pro.*",
]
ignore_missing_imports = true
