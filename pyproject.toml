[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotlift"
version = "0.1.0"
description = "Measure the lift of TV on web traffic and Amazon responses"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "httpx>=0.25.0"
]

[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","mypy"]
